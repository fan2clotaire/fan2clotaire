<script>
async function updateTwitchFollowers() {
    try {
        const response = await fetch(
            "https://fan2clotaire-stats.g-dubois89210.workers.dev/?platform=twitch"
        );

        const data = await response.json();

        document.getElementById("twitch-followers").textContent =
            data.followers;
    } catch (error) {
        console.error("Erreur compteur Twitch :", error);
    }
}

updateTwitchFollowers();
setInterval(updateTwitchFollowers, 5 * 60 * 1000);
</script>
