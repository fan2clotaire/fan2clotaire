<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration - Fan2Clotaire</title>

<style>

    .bouton-accueil {
    display: block;
    width: fit-content;
    margin: 0 auto 25px;
    padding: 10px 18px;
    border-radius: 10px;
    background: #1e293b;
    border: 1px solid #334155;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: background 0.2s, transform 0.2s;
}

.bouton-accueil:hover {
    background: #334155;
    transform: translateY(-2px);
}
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 32px;
    }

    #message {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 30px;
    }

    #recherche-utilisateur {
        display: block;
        width: 100%;
        max-width: 600px;
        margin: 0 auto 30px;
        padding: 14px 18px;
        border: 1px solid #334155;
        border-radius: 12px;
        background: #1e293b;
        color: white;
        font-size: 16px;
        outline: none;
    }

    #recherche-utilisateur:focus {
        border-color: #6366f1;
    }

    #recherche-utilisateur::placeholder {
        color: #94a3b8;
    }

    .stats-admin {
        width: 100%;
        max-width: 900px;
        margin: 0 auto 30px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .stat-admin {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 20px;
        text-align: center;
        transition: transform 0.2s, border-color 0.2s;
    }

    .stat-admin:hover {
        transform: translateY(-3px);
        border-color: #6366f1;
    }

    .stat-admin span {
        display: block;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .stat-admin strong {
        display: block;
        font-size: 28px;
        margin-bottom: 5px;
    }

    .stat-admin small {
        color: #94a3b8;
        font-size: 14px;
    }

    #liste-utilisateurs {
        width: 100%;
        max-width: 900px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    #liste-utilisateurs > div {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 18px 20px;
        transition: transform 0.2s, border-color 0.2s;
    }

    #liste-utilisateurs > div:hover {
        transform: translateY(-2px);
        border-color: #6366f1;
    }

    #liste-utilisateurs p {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .choix-role {
        margin-left: auto;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        cursor: pointer;
    }

    .bouton-role {
        padding: 9px 14px;
        border: none;
        border-radius: 8px;
        background: #6366f1;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
    }

    .bouton-role:hover {
        background: #818cf8;
        transform: scale(1.03);
    }

    .statut-live {
        display: block;
        text-align: center;
        margin-top: -20px;
        margin-bottom: 25px;
        color: #22c55e;
        font-size: 13px;
    }

    @media (max-width: 700px) {
        body {
            padding: 25px 12px;
        }

        h1 {
            font-size: 26px;
        }

        .stats-admin {
            grid-template-columns: repeat(2, 1fr);
        }

        #liste-utilisateurs p {
            flex-direction: column;
            align-items: flex-start;
        }

        .choix-role {
            margin-left: 0;
            width: 100%;
        }

        .bouton-role {
            width: 100%;
        }
    }

    @media (max-width: 400px) {
        .stats-admin {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>

<body>

    <a href="index.html" class="bouton-accueil">
    🏠 Retour à l'accueil
</a>

<h1>
    Administration 👑
</h1>

<p id="message">
    Vérification des permissions...
</p>

<span class="statut-live">
    🟢 Synchronisation en direct
</span>

<input
    type="text"
    id="recherche-utilisateur"
    placeholder="🔎 Rechercher un utilisateur"
>

<div class="stats-admin">

    <div class="stat-admin">
        <span>👥</span>
        <strong id="total-utilisateurs">0</strong>
        <small>Utilisateurs</small>
    </div>

    <div class="stat-admin">
        <span>👑</span>
        <strong id="total-admins">0</strong>
        <small>Administrateurs</small>
    </div>

    <div class="stat-admin">
        <span>🛡️</span>
        <strong id="total-moderateurs">0</strong>
        <small>Modérateurs</small>
    </div>

    <div class="stat-admin">
        <span>🚫</span>
        <strong id="total-suspendus">0</strong>
        <small>Suspendus</small>
    </div>

</div>

<div id="liste-utilisateurs"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://snnclgjspwninjxnimza.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_9lcVcbpeH8b64j2jD9w7Xw_xzfshZk2";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    let utilisateursActuels = [];

    async function verifierAdmin() {

        const {
            data: { user }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            window.location.href = "connexion.html";
            return;
        }

        const {
            data: profil,
            error
        } = await supabaseClient
            .from("profiles")
            .select("role")
            .eq("user_id", user.id)
            .maybeSingle();

        if (
            error ||
            !profil ||
            profil.role !== "admin"
        ) {
            document.getElementById("message").textContent =
                "Accès refusé.";
            return;
        }

        document.getElementById("message").textContent =
            "Bienvenue dans l'administration 👑";

        await chargerUtilisateurs();
        activerSynchronisation();
    }

    async function chargerEmails() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
            return [];
        }

        try {

            const response = await fetch(
                "https://fan2clotaire-stats.g-dubois89210.workers.dev/?platform=admin-users",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + session.access_token
                    }
                }
            );

            const data = await response.json();

            if (!data.users) {
                return [];
            }

            return data.users;

        } catch (error) {

            console.error(
                "Erreur récupération e-mails :",
                error
            );

            return [];
        }
    }

    function mettreAJourStatistiques(utilisateurs) {

        document.getElementById("total-utilisateurs").textContent =
            utilisateurs.length;

        document.getElementById("total-admins").textContent =
            utilisateurs.filter(
                utilisateur =>
                    utilisateur.role === "admin"
            ).length;

        document.getElementById("total-moderateurs").textContent =
            utilisateurs.filter(
                utilisateur =>
                    utilisateur.role === "moderator"
            ).length;

        document.getElementById("total-suspendus").textContent =
            utilisateurs.filter(
                utilisateur =>
                    utilisateur.role === "suspended"
            ).length;
    }

    async function chargerUtilisateurs() {

        const utilisateursAuth =
            await chargerEmails();

        const {
            data: utilisateurs,
            error
        } = await supabaseClient
            .from("profiles")
            .select(
                "user_id, username, role, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

        if (error) {

            console.error(
                "Erreur utilisateurs :",
                error
            );

            document.getElementById("message").textContent =
                "Erreur lors du chargement des utilisateurs.";

            return;
        }

        utilisateursActuels =
            utilisateurs || [];

        mettreAJourStatistiques(
            utilisateursActuels
        );

        const zone =
            document.getElementById(
                "liste-utilisateurs"
            );

        zone.innerHTML = "";

        utilisateursActuels.forEach(
            utilisateur => {

                const utilisateurAuth =
                    utilisateursAuth.find(
                        user =>
                            user.id ===
                            utilisateur.user_id
                    );

                const email =
                    utilisateurAuth?.email ||
                    "E-mail inconnu";

                const bloc =
                    document.createElement("div");

                bloc.innerHTML = `
                    <p>
                        👤

                        <strong>
                            ${utilisateur.username || "Sans pseudo"}
                        </strong>

                        — 📧
                        ${email}

                        — 🛡️
                        ${utilisateur.role}

                        <select class="choix-role">

                            <option value="user">
                                Utilisateur
                            </option>

                            <option value="moderator">
                                Modérateur
                            </option>

                            <option value="admin">
                                Administrateur
                            </option>

                            <option value="suspended">
                                Suspendu
                            </option>

                        </select>

                        <button
                            type="button"
                            class="bouton-role"
                        >
                            Modifier le rôle
                        </button>

                    </p>
                `;

                zone.appendChild(bloc);

                const choixRole =
                    bloc.querySelector(
                        ".choix-role"
                    );

                const boutonRole =
                    bloc.querySelector(
                        ".bouton-role"
                    );

                choixRole.value =
                    utilisateur.role;

                boutonRole.addEventListener(
                    "click",
                    async () => {

                        const {
                            data: {
                                session
                            }
                        } =
                            await supabaseClient
                                .auth
                                .getSession();

                        if (!session) {

                            alert(
                                "Session expirée."
                            );

                            return;
                        }

                        boutonRole.disabled = true;

                        boutonRole.textContent =
                            "Modification...";

                        try {

                            const response =
                                await fetch(
                                    "https://fan2clotaire-stats.g-dubois89210.workers.dev/?platform=admin-role",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Authorization":
                                                "Bearer " +
                                                session.access_token,

                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                user_id:
                                                    utilisateur.user_id,

                                                role:
                                                    choixRole.value
                                            })
                                    }
                                );

                            const data =
                                await response.json();

                            console.log(
                                "Réponse du Worker :",
                                data
                            );

                            if (!data.success) {

                                alert(
                                    data.error ||
                                    "Impossible de modifier le rôle."
                                );
                            }

                        } catch (error) {

                            console.error(
                                "Erreur modification rôle :",
                                error
                            );

                            alert(
                                "Erreur lors de la modification."
                            );

                        } finally {

                            boutonRole.disabled = false;

                            boutonRole.textContent =
                                "Modifier le rôle";
                        }
                    }
                );
            }
        );

        appliquerRecherche();
    }

    function appliquerRecherche() {

        const recherche =
            document
                .getElementById(
                    "recherche-utilisateur"
                )
                .value
                .toLowerCase()
                .trim();

        const utilisateurs =
            document.querySelectorAll(
                "#liste-utilisateurs > div"
            );

        utilisateurs.forEach(
            bloc => {

                const texte =
                    bloc.textContent.toLowerCase();

                bloc.style.display =
                    texte.includes(recherche)
                        ? "block"
                        : "none";
            }
        );
    }

    function activerSynchronisation() {

        supabaseClient
            .channel("admin-profiles-live")
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "profiles"
                },
                payload => {

                    console.log(
                        "Modification détectée :",
                        payload
                    );

                    chargerUtilisateurs();
                }
            )
            .subscribe(
                status => {

                    console.log(
                        "Synchronisation :",
                        status
                    );
                }
            );
    }

    document
        .getElementById(
            "recherche-utilisateur"
        )
        .addEventListener(
            "input",
            appliquerRecherche
        );

    verifierAdmin();
</script>

</body>
</html>
