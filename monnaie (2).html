<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Boutique Clocoins</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: white; background: radial-gradient(circle at top, #4c1d95 0%, transparent 40%), linear-gradient(135deg, #111827, #1e1b4b, #312e81); padding: 25px 15px 50px; } .container { width: min(100%, 1000px); margin: auto; } /* HEADER */ header { text-align: center; margin-bottom: 30px; } header h1 { margin: 0; font-size: clamp(32px, 7vw, 52px); } header p { color: #d1d5db; font-size: 17px; } /* SOLDE */ .solde { width: fit-content; margin: 0 auto 35px; padding: 14px 25px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px; font-size: 20px; font-weight: bold; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25); } .clocoin { color: #facc15; } /* BOUTIQUE */ .boutique { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; } .article { padding: 25px; text-align: center; background: rgba(15, 15, 30, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); transition: transform 0.2s ease, box-shadow 0.2s ease; } .article:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); } .article-image { width: 110px; height: 110px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: linear-gradient( 135deg, #312e81, #6d28d9 ); font-size: 55px; } .article h2 { margin: 10px 0; font-size: 23px; } .prix { margin: 12px 0 18px; color: #facc15; font-size: 20px; font-weight: bold; } .acheter { width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient( 135deg, #7c3aed, #4f46e5 ); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease; } .acheter:hover { transform: scale(1.03); } .acheter:active { transform: scale(0.97); } /* MESSAGE */ #message { position: fixed; left: 50%; bottom: 25px; transform: translateX(-50%) translateY(100px); padding: 14px 22px; border-radius: 14px; background: rgba(10, 10, 20, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); font-weight: bold; opacity: 0; transition: 0.3s ease; z-index: 100; } #message.visible { transform: translateX(-50%) translateY(0); opacity: 1; } /* RETOUR */ .retour { display: block; width: fit-content; margin: 35px auto 0; padding: 12px 20px; border-radius: 12px; background: rgba(255, 255, 255, 0.1); color: white; text-decoration: none; transition: background 0.2s ease; } .retour:hover { background: rgba(255, 255, 255, 0.18); } @media (max-width: 600px) { body { padding-top: 18px; } .article { padding: 20px; } .solde { font-size: 18px; } } </style> </head> <body> <div class="container"> <header> <h1>🪙 Boutique Clocoins</h1> <p>Dépense tes Clocoins pour obtenir des articles exclusifs !</p> </header> <div class="solde"> 🪙 Solde : <span id="solde">0</span> <span class="clocoin">Clocoins</span> </div> <div class="boutique"> <!-- ARTICLE 1 --> <div class="article"> <div class="article-image"> 👣 </div> <h2>Pieds de Clotaire</h2> <div class="prix"> 🪙 100 Clocoins </div> <button class="acheter" onclick="acheterArticle('Pieds de Clotaire', 100)" > 🛒 Acheter </button> </div> </div> <a href="index.html" class="retour"> ← Retour à l'accueil </a> </div> <div id="message"></div> <script> /* ========================= SOLDE DES CLOCOINS ========================= */ let clocoins = parseInt(localStorage.getItem("clocoins")) || 0; const soldeElement = document.getElementById("solde"); function mettreAJourSolde() { soldeElement.textContent = clocoins; localStorage.setItem( "clocoins", clocoins ); } mettreAJourSolde(); /* ========================= ACHAT ========================= */ function acheterArticle(nom, prix) { if (clocoins < prix) { afficherMessage( "❌ Tu n'as pas assez de Clocoins !" ); return; } clocoins -= prix; mettreAJourSolde(); afficherMessage( "✅ Tu as acheté : " + nom + " !" ); } /* ========================= MESSAGE ========================= */ let messageTimeout; function afficherMessage(texte) { const message = document.getElementById("message"); message.textContent = texte; message.classList.add("visible"); clearTimeout(messageTimeout); messageTimeout = setTimeout(() => { message.classList.remove("visible"); }, 2500); } </script> </body> </html>
