<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Boutique Clocoins</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: white; background: radial-gradient(circle at top, #4c1d95 0%, transparent 40%), linear-gradient(135deg, #111827, #1e1b4b, #312e81); padding: 25px 15px 50px; } .container { width: min(100%, 1000px); margin: auto; } header { text-align: center; margin-bottom: 30px; } header h1 { margin: 0; font-size: clamp(32px, 7vw, 52px); } header p { color: #d1d5db; font-size: 17px; } .compte { text-align: center; color: #c4b5fd; margin-bottom: 15px; } .solde { width: fit-content; margin: 0 auto 35px; padding: 14px 25px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px; font-size: 20px; font-weight: bold; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25); } .clocoin { color: #facc15; } .boutique { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; } .article { padding: 25px; text-align: center; background: rgba(15, 15, 30, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); transition: transform 0.2s ease, box-shadow 0.2s ease; } .article:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); } .article-image { width: 110px; height: 110px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: linear-gradient( 135deg, #312e81, #6d28d9 ); font-size: 55px; } .article h2 { margin: 10px 0; font-size: 23px; } .prix { margin: 12px 0 18px; color: #facc15; font-size: 20px; font-weight: bold; } .acheter { width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient( 135deg, #7c3aed, #4f46e5 ); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease; } .acheter:hover { transform: scale(1.03); } .acheter:active { transform: scale(0.97); } .acheter:disabled { opacity: 0.5; cursor: not-allowed; transform: none; } .retour { display: block; width: fit-content; margin: 35px auto 0; padding: 12px 20px; border-radius: 12px; background: rgba(255, 255, 255, 0.1); color: white; text-decoration: none; transition: background 0.2s ease; } .retour:hover { background: rgba(255, 255, 255, 0.18); } #message { position: fixed; left: 50%; bottom: 25px; transform: translateX(-50%) translateY(100px); padding: 14px 22px; border-radius: 14px; background: rgba(10, 10, 20, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); font-weight: bold; opacity: 0; transition: 0.3s ease; z-index: 100; text-align: center; } #message.visible { transform: translateX(-50%) translateY(0); opacity: 1; } #chargement { text-align: center; color: #c4b5fd; margin: 20px 0; } @media (max-width: 600px) { body { padding-top: 18px; } .article { padding: 20px; } .solde { font-size: 18px; } } </style> </head> <body> <div class="container"> <header> <h1>🪙 Boutique Clocoins</h1> <p> Dépense tes Clocoins pour obtenir des articles exclusifs ! </p> </header> <div class="compte" id="compte"> Connexion en cours... </div> <div class="solde"> 🪙 Solde : <span id="solde">...</span> <span class="clocoin">Clocoins</span> </div> <div id="chargement"> Chargement de ta boutique... </div> <div class="boutique"> <!-- PIEDS DE CLOTAIRE --> <div class="article"> <div class="article-image"> 👣 </div> <h2>Pieds de Clotaire</h2> <div class="prix"> 🪙 100 Clocoins </div> <button id="acheter-pieds" class="acheter" onclick="acheterArticle('Pieds de Clotaire', 100)" disabled > 🛒 Acheter </button> </div> </div> <a href="index.html" class="retour"> ← Retour à l'accueil </a> </div> <div id="message"></div> <!-- SUPABASE --> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script> /* ========================================= CONFIGURATION SUPABASE ========================================= */ const SUPABASE_URL = "https://snnclgjspwninjxnimza.supabase.co"; /* ⚠️ Mets ici ta clé publishable/anon que tu utilises déjà sur ton site. NE METS PAS ta SERVICE_ROLE_KEY ici. */ const SUPABASE_KEY = "TA_CLE_SUPABASE_PUBLISHABLE"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); /* ========================================= VARIABLES ========================================= */ let utilisateur = null; let clocoins = 0; const soldeElement = document.getElementById("solde"); const compteElement = document.getElementById("compte"); const chargementElement = document.getElementById("chargement"); const boutonPieds = document.getElementById("acheter-pieds"); /* ========================================= INITIALISATION ========================================= */ async function initialiser() { const { data: { user }, error } = await supabaseClient.auth.getUser(); if (error || !user) { compteElement.textContent = "❌ Tu dois être connecté pour utiliser les Clocoins."; soldeElement.textContent = "—"; chargementElement.textContent = "Connecte-toi à ton compte Fan2Clotaire."; return; } utilisateur = user; compteElement.textContent = "👤 Connecté"; await chargerPortefeuille(); } /* ========================================= CHARGER LE PORTEFEUILLE ========================================= */ async function chargerPortefeuille() { const { data, error } = await supabaseClient .from("clocoins") .select("solde") .eq("user_id", utilisateur.id) .maybeSingle(); if (error) { console.error(error); chargementElement.textContent = "❌ Impossible de charger ton portefeuille."; soldeElement.textContent = "Erreur"; return; } /* Si le portefeuille n'existe pas, on le crée automatiquement. */ if (!data) { const { data: nouveauPortefeuille, error: creationError } = await supabaseClient .from("clocoins") .insert({ user_id: utilisateur.id, solde: 0 }) .select("solde") .single(); if (creationError) { console.error(creationError); chargementElement.textContent = "❌ Impossible de créer ton portefeuille."; return; } clocoins = nouveauPortefeuille.solde; } else { clocoins = data.solde; } afficherSolde(); chargementElement.style.display = "none"; boutonPieds.disabled = false; } /* ========================================= AFFICHER LE SOLDE ========================================= */ function afficherSolde() { soldeElement.textContent = clocoins; } /* ========================================= ACHETER UN ARTICLE ========================================= */ async function acheterArticle(nom, prix) { if (!utilisateur) { afficherMessage( "❌ Connecte-toi à ton compte." ); return; } if (clocoins < prix) { afficherMessage( "❌ Tu n'as pas assez de Clocoins !" ); return; } boutonPieds.disabled = true; try { /* La fonction SQL vérifie elle-même que le solde est suffisant. */ const { data, error } = await supabaseClient.rpc( "depenser_clocoins", { montant: prix } ); if (error) { console.error(error); afficherMessage( "❌ L'achat n'a pas pu être effectué." ); return; } /* Le nouveau solde est renvoyé directement par Supabase. */ clocoins = data; afficherSolde(); afficherMessage( "✅ " + nom + " acheté !" ); } finally { boutonPieds.disabled = false; } } /* ========================================= MESSAGES ========================================= */ let messageTimeout; function afficherMessage(texte) { const message = document.getElementById("message"); message.textContent = texte; message.classList.add("visible"); clearTimeout(messageTimeout); messageTimeout = setTimeout(() => { message.classList.remove( "visible" ); }, 2500); } /* ========================================= LANCEMENT ========================================= */ initialiser(); </script> </body> </html>
